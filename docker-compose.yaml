services:
  netplay:
    build:
      context: .
      dockerfile: dockerfile.netplay
    container_name: retrozeca-netplay
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: retrozeca-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - netplay
      - romserver

  romserver:
    build:
      context: .
      dockerfile: dockerfile.romserver
    container_name: retrozeca-romserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - roms_data:/data
    environment:
      PGHOST: host.docker.internal
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-}
      PGDATABASE: ${PGDATABASE:-retrozeca}
    restart: unless-stopped

volumes:
  roms_data:
