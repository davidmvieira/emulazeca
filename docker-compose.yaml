version: '3.8'
services:
  netplay:
    build:
      context: .
      dockerfile: Dockerfile.netplay
    container_name: retrozeca-netplay
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retrozeca-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - netplay
      - romserver

  romserver:
    build:
      context: .
      dockerfile: Dockerfile.romserver
    container_name: retrozeca-romserver
    ports:
      - "4000:4000"
    volumes:
      - roms_data:/data
    restart: unless-stopped

volumes:
  roms_data: